<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arts | ek9no's Page</title>
  <meta name="description" content="ek9no's art gallery">
  <meta name="author" content="ek9no">

  <!-- Theme init (runs before paint to avoid a flash) -->
  <script>
    document.documentElement.dataset.theme = localStorage.getItem('theme') ||
      (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  </script>

  <link rel="stylesheet" href="./../css/style2.css">
  <link rel="stylesheet" href="./../css/arts.css">
  <script src="../js/theme.js"></script>
</head>

<body class="home-page">
  <div class="page">

    <header class="hero">
      <div class="site-title">✧ EK9NO'S PAGE ✧</div>
        <div class="site-shell">
       <header class="site-header">
        <nav class="site-nav" id="nav-btn" aria-label="Main navigation">
      <button onclick="location.href='../'">HOME</button>
      <button onclick="location.href='../about-me/'">ABOUT</button>
      <button onclick="location.href='../projects/'">PROJECTS</button>
      <button onclick="location.href='./../blog/'">BLOG</button>
      <button onclick="location.href=''">ARTS</button>  
      </nav>
      </header>
      </div>

      <button class="theme-toggle" aria-label="Toggle theme">
        <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <main>
      <div class="arts-wrap">

        <!-- Gallery -->
        <section class="panel gallery-section">
          <h2>My Arts</h2>
          <p class="gallery-count" id="gallery-count"></p>
          <div class="gallery-grid" id="gallery-grid">
            <!-- Arts loaded from gallery/images.json -->
          </div>
          <div class="gallery-empty" id="gallery-empty" style="display:none;">
            <p>No arts yet ✧</p>
          </div>
        </section>

      </div>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox-backdrop"></div>
      <div class="lightbox-content">
        <button class="lightbox-close" aria-label="Close">&times;</button>
        <button class="lightbox-prev" aria-label="Previous">&#8249;</button>
        <img class="lightbox-img" id="lightbox-img" alt="">
        <button class="lightbox-next" aria-label="Next">&#8250;</button>
        <div class="lightbox-info">
          <p class="lightbox-title" id="lightbox-title"></p>
        </div>
      </div>
    </div>

    <footer class="pagefoot">
      <a href="https://github.com/kekobade" target="_blank" rel="noopener noreferrer">github</a>
      &nbsp;·&nbsp;
      <a href="https://x.com/kekowashere" target="_blank" rel="noopener noreferrer">x</a>
        <br>
        <br>
        <p>© 2026 ek9no (kekobade)</p>
      
    </footer>

  </div>

  <script>
    /* ── Theme Toggle ── */
    const html = document.documentElement;
    const themeToggle = document.querySelector('.theme-toggle');

    function applyTheme(t) {
      html.dataset.theme = t;
      localStorage.setItem('theme', t);
    }

    themeToggle.addEventListener('click', () => {
      const next = html.dataset.theme === 'light' ? 'dark' : 'light';
      if (document.startViewTransition) {
        document.startViewTransition(() => applyTheme(next));
      } else {
        applyTheme(next);
      }
    });

    /* ── Gallery Logic ── */
    const galleryGrid = document.getElementById('gallery-grid');
    const galleryEmpty = document.getElementById('gallery-empty');
    const galleryCount = document.getElementById('gallery-count');

    // Lightbox elements
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxTitle = document.getElementById('lightbox-title');
    const lightboxClose = lightbox.querySelector('.lightbox-close');
    const lightboxPrev = lightbox.querySelector('.lightbox-prev');
    const lightboxNext = lightbox.querySelector('.lightbox-next');
    const lightboxBackdrop = lightbox.querySelector('.lightbox-backdrop');

    let galleryData = [];
    let currentLightboxIndex = -1;

    /* ── Load gallery from gallery/images.json ── */
    async function loadGallery() {
      try {
        const res = await fetch('gallery/images.json');
        if (!res.ok) throw new Error('Could not load images.json');
        galleryData = await res.json();
        renderGallery();
      } catch (e) {
        console.warn('Gallery load error:', e);
        galleryEmpty.style.display = 'block';
        galleryCount.textContent = '';
      }
    }

    function renderGallery() {
      galleryGrid.innerHTML = '';

      if (galleryData.length === 0) {
        galleryEmpty.style.display = 'block';
        galleryCount.textContent = '';
        return;
      }

      galleryEmpty.style.display = 'none';
      galleryCount.textContent = `${galleryData.length} art${galleryData.length !== 1 ? 's' : ''}`;

      galleryData.forEach((art, index) => {
        const card = document.createElement('div');
        card.className = 'gallery-card';
        card.innerHTML = `
          <div class="gallery-img-wrap" data-index="${index}">
            <img src="gallery/${art.file}" alt="${art.title || art.file}" loading="lazy">
          </div>
          <div class="gallery-card-info">
            <span class="gallery-card-title">${art.title || art.file}</span>
          </div>
        `;
        galleryGrid.appendChild(card);
      });

      // Click to open lightbox
      galleryGrid.querySelectorAll('.gallery-img-wrap').forEach(wrap => {
        wrap.addEventListener('click', () => {
          openLightbox(parseInt(wrap.dataset.index));
        });
      });
    }

    /* ── Lightbox ── */
    function openLightbox(index) {
      if (index < 0 || index >= galleryData.length) return;

      currentLightboxIndex = index;
      const art = galleryData[index];
      lightboxImg.src = 'gallery/' + art.file;
      lightboxImg.alt = art.title || art.file;
      lightboxTitle.textContent = art.title || art.file;
      lightbox.hidden = false;
      document.body.style.overflow = 'hidden';

      lightboxPrev.style.display = index > 0 ? '' : 'none';
      lightboxNext.style.display = index < galleryData.length - 1 ? '' : 'none';
    }

    function closeLightbox() {
      lightbox.hidden = true;
      document.body.style.overflow = '';
      currentLightboxIndex = -1;
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightboxBackdrop.addEventListener('click', closeLightbox);

    lightboxPrev.addEventListener('click', () => {
      if (currentLightboxIndex > 0) openLightbox(currentLightboxIndex - 1);
    });

    lightboxNext.addEventListener('click', () => {
      if (currentLightboxIndex < galleryData.length - 1) openLightbox(currentLightboxIndex + 1);
    });

    document.addEventListener('keydown', (e) => {
      if (lightbox.hidden) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft' && currentLightboxIndex > 0) openLightbox(currentLightboxIndex - 1);
      if (e.key === 'ArrowRight' && currentLightboxIndex < galleryData.length - 1) openLightbox(currentLightboxIndex + 1);
    });

    /* ── Init ── */
    loadGallery();
  </script>
</body>
</html>
